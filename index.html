<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #c9a84c;
    --gold-light: #f0d080;
    --gold-dim: #7a6230;
    --bg: #0a0a0c;
    --surface: rgba(255,255,255,0.04);
    --border: rgba(201,168,76,0.2);
    --text: #e8e2d4;
    --muted: rgba(232,226,212,0.45);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    overflow: hidden;
  }

  /* ── Canvas background ── */
  canvas#bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0.55;
  }

  /* ── Grain overlay ── */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E");
    background-size: 180px 180px;
    opacity: 0.45;
  }

  /* ── Layout ── */
  .page {
    position: relative;
    z-index: 2;
    display: flex;
    height: 100vh;
    align-items: center;
    justify-content: center;
  }

  .card {
    width: min(420px, 92vw);
    padding: 3rem 3rem 2.75rem;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 4px;
    backdrop-filter: blur(24px) saturate(1.2);
    position: relative;
    animation: rise 0.9s cubic-bezier(0.22,1,0.36,1) both;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 5px;
    background: linear-gradient(135deg, rgba(201,168,76,0.3) 0%, transparent 50%, rgba(201,168,76,0.08) 100%);
    pointer-events: none;
    z-index: -1;
  }

  /* top accent line */
  .card::after {
    content: '';
    position: absolute;
    top: 0; left: 10%; right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(28px) scale(0.98); }
    to   { opacity: 1; transform: none; }
  }

  /* ── Logo area ── */
  .logo-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 2.5rem;
    animation: fade 1s 0.1s both;
  }

  .logo-mark {
    width: 32px; height: 32px;
    border: 1px solid var(--gold);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }

  .logo-mark::before {
    content: '';
    width: 10px; height: 10px;
    background: var(--gold);
    border-radius: 50%;
  }

  .logo-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold-light);
  }

  /* ── Heading ── */
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(2rem, 5vw, 2.6rem);
    line-height: 1.1;
    letter-spacing: -0.01em;
    margin-bottom: 0.4rem;
    animation: fade 1s 0.2s both;
  }

  h1 em {
    font-style: italic;
    color: var(--gold-light);
  }

  .subtitle {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.02em;
    margin-bottom: 2.25rem;
    animation: fade 1s 0.3s both;
  }

  @keyframes fade {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }

  /* ── Fields ── */
  .field {
    margin-bottom: 1.1rem;
    animation: fade 1s both;
  }
  .field:nth-child(1) { animation-delay: 0.35s; }
  .field:nth-child(2) { animation-delay: 0.42s; }

  label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 7px;
  }

  input[type="email"],
  input[type="password"] {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 0.5px solid rgba(201,168,76,0.25);
    border-radius: 3px;
    padding: 13px 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 300;
    color: var(--text);
    outline: none;
    transition: border-color 0.25s, background 0.25s;
    -webkit-appearance: none;
  }

  input[type="email"]::placeholder,
  input[type="password"]::placeholder {
    color: rgba(232,226,212,0.25);
  }

  input:focus {
    border-color: rgba(201,168,76,0.6);
    background: rgba(255,255,255,0.08);
  }

  /* ── Row meta ── */
  .meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.75rem;
    animation: fade 1s 0.48s both;
  }

  .remember {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-size: 12.5px;
    color: var(--muted);
    user-select: none;
  }

  .remember input { display: none; }

  .check-box {
    width: 15px; height: 15px;
    border: 0.5px solid rgba(201,168,76,0.35);
    border-radius: 2px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, border-color 0.2s;
    flex-shrink: 0;
  }

  .remember input:checked + .check-box {
    background: var(--gold);
    border-color: var(--gold);
  }

  .check-box::after {
    content: '';
    width: 8px; height: 8px;
    background: url("data:image/svg+xml,%3Csvg viewBox='0 0 8 8' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 4l2 2 4-4' stroke='%230a0a0c' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E") center/contain no-repeat;
    opacity: 0;
    transition: opacity 0.15s;
  }

  .remember input:checked ~ .check-box::after,
  .remember input:checked + .check-box::after { opacity: 1; }

  .forgot {
    font-size: 12.5px;
    color: var(--gold-dim);
    text-decoration: none;
    letter-spacing: 0.02em;
    transition: color 0.2s;
  }
  .forgot:hover { color: var(--gold-light); }

  /* ── Button ── */
  .btn {
    width: 100%;
    padding: 14px;
    background: var(--gold);
    border: none;
    border-radius: 3px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #0a0a0c;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: background 0.25s, transform 0.15s;
    animation: fade 1s 0.54s both;
  }

  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.12);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.35s ease;
  }

  .btn:hover::before { transform: scaleX(1); }
  .btn:active { transform: scale(0.98); }

  /* ── Divider ── */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 1.5rem 0;
    animation: fade 1s 0.6s both;
  }
  .divider span { flex: 1; height: 0.5px; background: rgba(201,168,76,0.15); }
  .divider p { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; }

  /* ── Social ── */
  .socials {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    animation: fade 1s 0.66s both;
  }

  .social-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 11px;
    background: rgba(255,255,255,0.04);
    border: 0.5px solid rgba(255,255,255,0.1);
    border-radius: 3px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12.5px;
    color: var(--muted);
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
    text-decoration: none;
  }
  .social-btn:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.2);
    color: var(--text);
  }

  .social-icon { width: 16px; height: 16px; flex-shrink: 0; }

  /* ── Footer ── */
  .card-footer {
    text-align: center;
    margin-top: 2rem;
    font-size: 12.5px;
    color: var(--muted);
    animation: fade 1s 0.72s both;
  }

  .card-footer a {
    color: var(--gold);
    text-decoration: none;
    transition: color 0.2s;
  }
  .card-footer a:hover { color: var(--gold-light); }

  /* ── Corner decoration ── */
  .corner {
    position: absolute;
    width: 18px; height: 18px;
    border-color: rgba(201,168,76,0.4);
    border-style: solid;
  }
  .corner.tl { top: 14px; left: 14px; border-width: 1px 0 0 1px; }
  .corner.tr { top: 14px; right: 14px; border-width: 1px 1px 0 0; }
  .corner.bl { bottom: 14px; left: 14px; border-width: 0 0 1px 1px; }
  .corner.br { bottom: 14px; right: 14px; border-width: 0 1px 1px 0; }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="page">
  <div class="card" role="main">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="logo-row">
      <div class="logo-mark"></div>
      <span class="logo-text">Aurum</span>
    </div>

    <h1>Welcome<br /><em>back.</em></h1>
    <p class="subtitle">Sign in to continue your session</p>

    <form onsubmit="return false;">
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <div class="meta-row">
        <label class="remember">
          <input type="checkbox" />
          <span class="check-box"></span>
          Remember me
        </label>
        <a href="#" class="forgot">Forgot password?</a>
      </div>

      <button type="submit" class="btn">Sign In</button>
    </form>

    <div class="divider">
      <span></span><p>or continue with</p><span></span>
    </div>

    <div class="socials">
      <a href="#" class="social-btn">
        <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Google
      </a>
      <a href="#" class="social-btn">
        <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M16.365 1.43c0 1.14-.493 2.27-1.177 3.08-.744.9-1.99 1.57-2.987 1.57-.12 0-.23-.02-.3-.03-.01-.06-.04-.22-.04-.39 0-1.15.572-2.27 1.206-2.98.804-.94 2.142-1.64 3.248-1.68.03.13.05.28.05.43zm4.565 15.71c-.03.07-.463 1.58-1.518 3.12-.945 1.34-1.94 2.71-3.43 2.71-1.517 0-1.9-.88-3.63-.88-1.698 0-2.302.91-3.67.91-1.377 0-2.332-1.26-3.428-2.8-1.287-1.82-2.323-4.63-2.323-7.28 0-3.827 2.485-5.855 4.929-5.855 1.302 0 2.387.87 3.205.87.765 0 2.246-.91 3.737-.91.6 0 2.587.247 3.939 2.297zm-2.53-2.317c-.787-1.04-1.89-1.75-3.072-1.75-1.59 0-2.374.97-3.607.97-1.247 0-2.2-.97-3.54-.97-1.643 0-3.464 1.41-3.464 4.15 0 2.44.97 5.24 2.185 6.97.877 1.24 1.63 2.28 2.737 2.28 1.12 0 1.517-.75 3.017-.75 1.53 0 1.845.75 3.015.75 1.1 0 1.9-1.08 2.8-2.32.95-1.39 1.35-2.72 1.35-2.79-.07-.02-2.6-1.04-2.6-3.88 0-2.44 1.96-3.55 2.07-3.63z"/>
        </svg>
        Apple
      </a>
    </div>

    <div class="card-footer">
      Don't have an account? <a href="#">Create one</a>
    </div>
  </div>
</div>

<script>
/* Animated particle/line background */
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
let W, H, pts;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  init();
}

function init() {
  const n = Math.floor((W * H) / 14000);
  pts = Array.from({ length: n }, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    vx: (Math.random() - 0.5) * 0.25,
    vy: (Math.random() - 0.5) * 0.25,
    r: Math.random() * 1.5 + 0.4,
  }));
}

function draw(t) {
  ctx.clearRect(0, 0, W, H);

  /* soft radial glow centre */
  const grd = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W * 0.55);
  grd.addColorStop(0,   'rgba(100,78,30,0.28)');
  grd.addColorStop(0.5, 'rgba(20,16,8,0.14)');
  grd.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);

  /* move + draw points */
  for (const p of pts) {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
    if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(201,168,76,0.55)';
    ctx.fill();
  }

  /* connect nearby points */
  const maxDist = 130;
  for (let i = 0; i < pts.length; i++) {
    for (let j = i + 1; j < pts.length; j++) {
      const dx = pts[i].x - pts[j].x;
      const dy = pts[i].y - pts[j].y;
      const d  = Math.sqrt(dx*dx + dy*dy);
      if (d < maxDist) {
        ctx.beginPath();
        ctx.moveTo(pts[i].x, pts[i].y);
        ctx.lineTo(pts[j].x, pts[j].y);
        ctx.strokeStyle = `rgba(201,168,76,${0.18 * (1 - d / maxDist)})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }

  requestAnimationFrame(draw);
}

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(draw);
</script>
</body>
</html>
